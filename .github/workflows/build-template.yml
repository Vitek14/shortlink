name: Docker Build Template

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform to build (for example linux/amd64)'
        required: true
        type: string
      push_image:
        description: 'Push image to registry'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx  # for caching support(below) and other features in future(like building for arm)
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if push is true)
        if: inputs.push_image == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and optionally push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ inputs.platform }}
          push: ${{ inputs.push_image }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shortlink:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/shortlink:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
